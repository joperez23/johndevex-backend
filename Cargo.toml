[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Ntex Web Framework v3.12.3
ntex = { version = "3.12.3", features = ["tokio"] }
# ntex-server = "=3.10.4"
# ntex-rt = "=3.16.1"

# Async runtime & Web Requests
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
scraper = "0.27.0"
regex = "1.13.1"

# Database & Precision Numeric
sqlx = { version = "0.9.0", features = [
  "postgres",
  "runtime-tokio",
  "chrono",
  "bigdecimal",
  "macros",
] }
bigdecimal = { version = "0.4.10", features = ["serde"] }

# Serialization & Datetime
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }

# Environment & Errors & Logs
dotenvy = "0.15.7"
thiserror = "2.0.20"
log = "0.4.33"
env_logger = "0.11.11"
headless_chrome = "1.0.22"
urlencoding = "2.1.3"
